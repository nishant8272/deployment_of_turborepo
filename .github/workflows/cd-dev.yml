name: Deploy to dev
on:
  push:
    branches:
     - main 

jobs:
  redeploy_everything:
    runs-on: ubuntu-latest
    name: Redeploy Everything
    steps:
      - run: |
          echo "${{ secrets.NISHANTKEY }}" &> ~/nishantkey
          mkdir -p /home/runner/.ssh
          ls  /home/runner/.ssh
          touch /home/runner/.ssh/known_hosts
          echo "${{secrets.KNOWN_HOST}}" &> /home/runner/.ssh/known_hosts
          chmod 700 ~/nishantkey
          ssh -i ~/nishantkey ubuntu@13.60.231.57 -t "
            set -e &&
            cd ~/deployment_of_turborepo &&

            # Load nvm if installed
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"

            # Ensure Node.js 25 and pnpm
            nvm install 25 || true &&
            nvm use 25 &&
            npm install -g pnpm pm2 &&

            # Pull latest changes and rebuild
            git fetch origin main &&
            git reset --hard origin/main &&
            pnpm install &&
            pnpm run build &&

            # Restart PM2 processes
            pm2 restart websocket || pm2 start apps/ws-server/dist/index.js --name websocket &&
            pm2 restart http || pm2 start apps/http-server/dist/index.js --name http &&
            pm2 restart web || pm2 start apps/web/.next/standalone/server.js --name web
          "
          
